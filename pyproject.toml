[project]
name = "pytrosna-benchmark"
version = "0.1.0"
description = "Reproducible correctness checks and benchmarks of the pytrosna library (Trosna time-series files)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytrosna[all]==0.1.1",
    "matplotlib>=3.8",
    "jupyterlab>=4.0",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
]

[tool.uv]
package = false
constraint-dependencies = ["pyarrow<26 ; python_full_version >= '3.14'"]
